<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Resume & Cover Letter Tailor</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Alpine.js via CDN (For Easy UI State Management) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <style>
    /* Custom CSS for Smooth Transitions */
    .fade-enter {
      animation: fadeIn 0.4s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans antialiased">

  <div class="max-w-4xl mx-auto px-4 py-12" x-data="appData()" x-init="initApp()">
    
    <!-- Header Section -->
    <header class="text-center space-y-3 mb-10">
      <div class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-2">
        Turnkey AI Micro-SaaS
      </div>
      <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight" x-text="config.appName || 'AI Resume Tailor'"></h1>
      <p class="text-slate-600 text-base md:text-lg max-w-2xl mx-auto" x-text="config.appDescription"></p>
    </header>

    <!-- API Key Input Banner (Buyer White-Label Friendly) -->
    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-8 text-sm text-amber-900 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-amber-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z"></path></svg>
        <span>Enter your <strong>OpenAI API Key</strong> to test live generation:</span>
      </div>
      <input 
        type="password" 
        x-model="apiKey" 
        placeholder="sk-..." 
        class="w-full sm:w-64 px-3 py-1.5 border border-amber-300 rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-amber-500"
      >
    </div>

    <!-- Main Input Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8">
      <form @submit.prevent="generateTailoredApplication()" class="space-y-6">
        <div class="grid md:grid-cols-2 gap-6">
          
          <!-- Resume Input -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Your Resume Text</label>
            <textarea 
              x-model="resumeText"
              required 
              rows="9" 
              placeholder="Paste your current resume content here..."
              class="w-full p-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition"
            ></textarea>
          </div>

          <!-- Job Description Input -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Job Description</label>
            <textarea 
              x-model="jobDescription"
              required 
              rows="9" 
              placeholder="Paste the target job description here..."
              class="w-full p-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition"
            ></textarea>
          </div>

        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          :disabled="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-md hover:shadow-lg disabled:opacity-50 flex items-center justify-center gap-2"
        >
          <span x-show="!loading">Generate Application Package</span>
          <span x-show="loading" class="flex items-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Analyzing with AI...
          </span>
        </button>
      </form>
    </div>

    <!-- Results Section -->
    <template x-if="result">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6 fade-enter">
        
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
          <h2 class="text-xl font-bold text-slate-900">AI Analysis & Results</h2>
          <div class="bg-emerald-100 text-emerald-800 border border-emerald-200 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5">
            <span>Match Score:</span>
            <span x-text="result.matchScore"></span>
          </div>
        </div>

        <!-- Missing Keywords -->
        <div>
          <h3 class="text-sm font-semibold text-slate-700 mb-3">Missing Keywords & Skills to Add:</h3>
          <div class="flex flex-wrap gap-2">
            <template x-for="(keyword, index) in result.missingKeywords" :key="index">
              <span class="bg-slate-100 text-slate-800 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200" x-text="keyword"></span>
            </template>
          </div>
        </div>

        <!-- Generated Cover Letter -->
        <div>
          <h3 class="text-sm font-semibold text-slate-700 mb-3">Tailored Cover Letter:</h3>
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 text-sm leading-relaxed text-slate-800 whitespace-pre-line font-mono" x-text="result.coverLetter"></div>
        </div>

      </div>
    </template>

  </div>

  <!-- JavaScript App Logic -->
  <script>
    function appData() {
      return {
        config: {},
        apiKey: '',
        resumeText: '',
        jobDescription: '',
        loading: false,
        result: null,

        async initApp() {
          try {
            const response = await fetch('config.json');
            this.config = await response.json();
          } catch (e) {
            this.config = { appName: "AI Resume Tailor", appDescription: "Tailor your resume instantly." };
          }
        },

        async generateTailoredApplication() {
          if (!this.apiKey) {
            alert('Please enter your OpenAI API key at the top banner to generate results!');
            return;
          }

          this.loading = true;
          this.result = null;

          const promptText = `
            You are an ATS (Applicant Tracking System) expert. Analyze this resume against the job description.
            
            Resume:
            ${this.resumeText}

            Job Description:
            ${this.jobDescription}

            Respond ONLY with a valid JSON object matching this exact structure (no markdown formatting):
            {
              "matchScore": "85%",
              "missingKeywords": ["Skill 1", "Skill 2", "Skill 3"],
              "coverLetter": "Detailed tailored cover letter text..."
            }
          `;

          try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.apiKey}`
              },
              body: JSON.stringify({
                model: this.config.openaiModel || 'gpt-3.5-turbo',
                messages: [{ role: 'user', content: promptText }],
                temperature: 0.7
              })
            });

            const data = await response.json();
            
            if (data.error) {
              alert('OpenAI API Error: ' + data.error.message);
              return;
            }

            const rawContent = data.choices[0].message.content;
            this.result = JSON.parse(rawContent);

          } catch (error) {
            alert('Failed to process request. Make sure your API key is valid.');
            console.error(error);
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
